<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f93e0"/>
      <stop offset="1" stop-color="#bfe0fa"/>
    </linearGradient>
    <clipPath id="skyClip">
      <circle cx="156" cy="150" r="80"/>
    </clipPath>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.5" fill="#e0524a"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#2b2b2b"/>
  <text x="480" y="30" text-anchor="middle" fill="#dddddd" font-size="16">DayTimeHUD mock (2x) - top-left of the screen</text>

  <!-- 1 panel -->
  <rect x="40" y="40" width="680" height="220" rx="24" fill="#1b1512" stroke="#7a5233" stroke-width="8"/>
  <rect x="52" y="52" width="656" height="196" rx="18" fill="none" stroke="#3a2a1e" stroke-width="2"/>

  <!-- 2 sky mask (circle, tinted by code) -->
  <circle cx="156" cy="150" r="80" fill="url(#sky)"/>
  <g clip-path="url(#skyClip)">
    <!-- 5 horizon -->
    <rect x="76" y="186" width="160" height="44" fill="#000" opacity="0.28"/>
    <line x1="76" y1="186" x2="236" y2="186" stroke="#000" stroke-width="2" opacity="0.5"/>
    <!-- arc guide -->
    <path d="M 88 186 A 68 68 0 0 1 224 186" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="5 6" opacity="0.7"/>
    <!-- 3 sun -->
    <g transform="translate(122 127)">
      <g stroke="#f3a51c" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-30" x2="0" y2="-38"/>
        <line x1="0" y1="30" x2="0" y2="38"/>
        <line x1="-30" y1="0" x2="-38" y2="0"/>
        <line x1="30" y1="0" x2="38" y2="0"/>
        <line x1="21" y1="-21" x2="27" y2="-27"/>
        <line x1="-21" y1="21" x2="-27" y2="27"/>
        <line x1="21" y1="21" x2="27" y2="27"/>
        <line x1="-21" y1="-21" x2="-27" y2="-27"/>
      </g>
      <circle r="24" fill="#ffd23f" stroke="#c9861a" stroke-width="3"/>
    </g>
    <!-- 4 moon (below the horizon = hidden at day) -->
    <g transform="translate(200 214)" opacity="0.5">
      <circle r="20" fill="#d6e2ff" stroke="#8a97b8" stroke-width="3"/>
      <circle cx="9" cy="-6" r="16" fill="#0e1a30" opacity="0.55"/>
    </g>
  </g>
  <!-- 3 frame ring -->
  <circle cx="156" cy="150" r="80" fill="none" stroke="#7a5233" stroke-width="10"/>
  <circle cx="156" cy="150" r="86" fill="none" stroke="#3a2a1e" stroke-width="2"/>

  <!-- 6 texts -->
  <text x="272" y="118" fill="#f1e6cf" font-size="60" font-weight="bold">DAY 3</text>
  <text x="272" y="208" fill="#f1e6cf" font-size="50">14:30</text>
  <text x="688" y="208" fill="#b9ad98" font-size="34" text-anchor="end">Afternoon</text>
  <!-- 7 phase icon slot -->
  <rect x="628" y="68" width="60" height="60" rx="8" fill="none" stroke="#e0524a" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- callouts -->
  <g stroke="#e0524a" stroke-width="2" fill="none">
    <line x1="60" y1="60" x2="60" y2="300" marker-end="url(#dot)"/>
    <line x1="156" y1="70" x2="156" y2="300" marker-end="url(#dot)"/>
    <line x1="122" y1="127" x2="300" y2="300" marker-end="url(#dot)"/>
    <line x1="200" y1="214" x2="420" y2="300" marker-end="url(#dot)"/>
    <line x1="90" y1="186" x2="540" y2="300" marker-end="url(#dot)"/>
    <line x1="330" y1="130" x2="660" y2="300" marker-end="url(#dot)"/>
    <line x1="658" y1="128" x2="820" y2="300" marker-end="url(#dot)"/>
  </g>
  <g fill="#e0524a" font-size="20" font-weight="bold">
    <circle cx="60" cy="300" r="14" fill="#e0524a"/><text x="60" y="307" text-anchor="middle" fill="#fff">1</text>
    <circle cx="156" cy="300" r="14" fill="#e0524a"/><text x="156" y="307" text-anchor="middle" fill="#fff">2</text>
    <circle cx="300" cy="300" r="14" fill="#e0524a"/><text x="300" y="307" text-anchor="middle" fill="#fff">3</text>
    <circle cx="420" cy="300" r="14" fill="#e0524a"/><text x="420" y="307" text-anchor="middle" fill="#fff">4</text>
    <circle cx="540" cy="300" r="14" fill="#e0524a"/><text x="540" y="307" text-anchor="middle" fill="#fff">5</text>
    <circle cx="660" cy="300" r="14" fill="#e0524a"/><text x="660" y="307" text-anchor="middle" fill="#fff">6</text>
    <circle cx="820" cy="300" r="14" fill="#e0524a"/><text x="820" y="307" text-anchor="middle" fill="#fff">7</text>
  </g>

  <!-- legend -->
  <g fill="#e6e6e6" font-size="18">
    <text x="40" y="350">1  hud_panel.png  680x220  9-slice background plate (wood / parchment, empty middle)</text>
    <text x="40" y="378">2  hud_sky_mask.png  176x176  solid white circle, code tints it with the sky colour and clips 3 and 4 to it</text>
    <text x="40" y="406">3  sun.png  64x64  travels on the dashed arc from left to right during the day</text>
    <text x="40" y="434">4  moon.png  56x56  same arc at night (shown here below the horizon = hidden)</text>
    <text x="40" y="462">5  horizon: part of the frame art (hud_sky_frame.png 176x176, ring with a transparent centre)</text>
    <text x="40" y="490">6  texts come from code: DAY + number, time, phase name. Only a .ttf font is needed</text>
    <text x="40" y="518">7  optional phase icons 64x64 x4 (sunrise, sun, sunset, moon)</text>
  </g>
  <text x="920" y="548" text-anchor="end" fill="#888" font-size="14">screen size = half of these numbers (panel 340x110)</text>
</svg>
